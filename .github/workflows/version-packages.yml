name: Version Packages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: version-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets Changesets attribute changelog entries to commits.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.0.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Version mode only. publish-script is omitted, so this job never publishes,
      # tags, or opens GitHub releases. Publishing stays in release.yml.
      # PRs created with the default GITHUB_TOKEN do not trigger CI; docs/releases.md
      # describes that caveat. pnpm version-packages formats generated files and
      # checks the lockfile before the action commits them.
      - name: Create or update the version pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          pr-title: Version Packages
          commit-message: Version Packages
