name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment configured on the npm trusted publisher.
    environment: npmjs
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Require dispatch from a current main
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Releases must be dispatched from main."
            exit 1
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main has advanced since this commit; dispatch a fresh run."
            exit 1
          fi

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:release
      - name: Inspect package tarballs
        run: pnpm -r pack --dry-run
      - name: Restore this run's release plan on retry
        id: restore-plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "channels-release-plan") | .id')
          if [ -n "${ARTIFACT_ID}" ]; then
            gh run download "${GITHUB_RUN_ID}" --name channels-release-plan --dir .release
            echo "restored=true" >> "${GITHUB_OUTPUT}"
          elif [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "Retry plan is missing; inspect publication evidence before starting another run."
            exit 1
          fi
      - name: Prepare the package release plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-packages.mjs --prepare
      - name: Persist the plan before publication
        if: steps.restore-plan.outputs.restored != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: channels-release-plan
          path: .release/plan.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      # Keep the npmjs environment and OIDC identity configured for these packages.
      - name: Publish missing versions and create per-package releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-packages.mjs --execute
