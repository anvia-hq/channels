name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment configured on the npm trusted publisher.
    environment: npmjs
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Require dispatch from a current main
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Releases must be dispatched from main."
            exit 1
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main has advanced since this commit; dispatch a fresh run."
            exit 1
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:release
      - name: Inspect package tarballs
        run: pnpm -r --if-present pack --dry-run
      # Authenticates through the GitHub Actions OIDC token (trusted
      # publishing) — no NPM_TOKEN secret. Private packages are skipped;
      # remove `private` only for packages meant for npm.
      - run: pnpm -r --if-present publish --provenance --no-git-checks
      # All packages release together; the tag comes from @anvia/channel's
      # version. Tags and the GitHub release only exist after a successful
      # publish.
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/channel/package.json').version")
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --verify-tag --generate-notes
