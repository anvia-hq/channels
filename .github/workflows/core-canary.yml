name: Core canary

on:
  schedule:
    # Mondays 06:00 UTC — catches @anvia/core changes between dependency updates.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  against-latest-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.4
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install against the newest published @anvia/core
        run: |
          pnpm install --no-frozen-lockfile
          pnpm -r update '@anvia/core@latest'
      - run: pnpm verify:release
