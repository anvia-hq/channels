name: Core canary

on:
  schedule:
    # Mondays 06:00 UTC — catches @anvia/core changes between Dependabot PRs.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  against-latest-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install against the newest published @anvia/core
        run: |
          pnpm install --no-frozen-lockfile
          pnpm -r update '@anvia/core@latest'
      - run: pnpm verify:release
